---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - infrastructure.vm-api.io
  resources:
  - containermachines
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - infrastructure.vm-api.io
  resources:
  - containermachines/status
  verbs:
  - get
  - patch
- apiGroups:
  - vm-api.io
  resources:
  - virtualmachines
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - vm-api.io
  resources:
  - virtualmachines/finalizers
  verbs:
  - update
- apiGroups:
  - vm-api.io
  resources:
  - virtualmachines/status
  verbs:
  - get
  - patch
